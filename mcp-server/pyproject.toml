[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orphan-disease-opportunity-mcp"
version = "1.5.0"
description = "Model Context Protocol (MCP) server covering 7,000+ orphan diseases live (OpenTargets + ClinicalTrials.gov v2 + PubMed) plus 6 curated hematology/immunology venture & translational deep-dives."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Rare Disease Venture Atlas", email = "open-science@rare-disease-atlas.github.io" }
]
keywords = [
  "mcp",
  "mcp-server",
  "model-context-protocol",
  "rare-disease",
  "orphan-drug",
  "drug-repurposing",
  "computational-biology",
  "public-health",
  "biotech",
  "myelofibrosis",
  "jak2"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Medical Science Apps."
]
# Zero third-party runtime dependencies required — runs out of the box anywhere Python >=3.10 is installed.
dependencies = []

[project.urls]
Homepage = "https://rare-disease-atlas.github.io"
Repository = "https://github.com/rare-disease-atlas/orphan-disease-opportunity-mcp"
Issues = "https://github.com/rare-disease-atlas/orphan-disease-opportunity-mcp/issues"
Dataset = "https://rare-disease-atlas.github.io/opportunities.json"
Documentation = "https://rare-disease-atlas.github.io/llms.txt"

[project.scripts]
orphan-disease-opportunity-mcp = "orphan_disease_mcp.server:main"
orphan-disease-mcp = "orphan_disease_mcp.server:main"

[tool.setuptools]
packages = ["orphan_disease_mcp"]
include-package-data = true

[tool.setuptools.package-data]
orphan_disease_mcp = ["data/*.json"]
