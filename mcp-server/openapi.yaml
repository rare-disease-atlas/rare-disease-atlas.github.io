openapi: 3.1.0
info:
  title: Orphan Disease Venture & Translational Opportunity API
  version: 1.6.0
  summary: Zero-auth static JSON, SEP-1649 MCP Server Card, A2A Agent Card, and Edge endpoints for AI agents, Custom GPT Actions, and OpenAPI tool callers.
  description: >
    Machine-readable startup blueprints, biological tractability, FDA Orphan Drug Act unit economics,
    non-dilutive SBIR/venture-philanthropy grants, 90-day validation roadmaps, and ethical clinical validation pathways.
    Anchored on Paired Myelofibrosis Flagships—Clonal JAK2 V617F+ Primary Myelofibrosis (`jak2-myelofibrosis`)
    and Reversible JAK2-Negative Autoimmune Myelofibrosis + Iron/Hepcidin Overload (`autoimmune-myelofibrosis`)—plus
    4 comparative hematology/immunology cohorts, live 7,000-orphan-disease MCP diligence (`https://api.rare-disease-atlas.workers.dev/mcp`,
    canonical v1.6.0 read-verb tools: `search_founder_opportunities`, `get_disease_case_study`, `list_non_dilutive_grants`,
    `get_validation_communities`, `get_90_day_validation_plan`, `search_any_orphan_indication`), the Open Agent Nectar Suite
    (`POST /api/stress-test`, `GET/POST /api/grade-benchmark`, `GET /api/gene`, `GET /api/pocket`, `GET /api/compare`, `GET /api/leaderboard.json`,
    `GET /feeds/catalysts.json`, `GET /feeds/myelofibrosis-catalysts.ics`, `/benchmarks/leaderboard.html`,
    `/benchmarks/myelofibrosis_bench.jsonl`, `/open-problems.json`, `/feeds/bio-delta.json`, `/atom.xml`,
    `/.well-known/x402.json`, `/CITATION.cff`), MyelofibrosisBench-v1.1 (50 test + 5 dev items on
    `huggingface.co/datasets/rare-disease-atlas/MyelofibrosisBench` and `github.com/rare-disease-atlas/myelofibrosis-bench`
    with EleutherAI `lm-eval` and UK AISI `Inspect AI` harnesses), and 3 Hugging Face Parquet tables (`myelofibrosis_gene_signatures`,
    `jak2_structural_pockets`, `myelofibrosis_clinical_trials` on `huggingface.co/datasets/rare-disease-atlas/rare-disease-venture-atlas`).
  contact:
    name: Rare Disease Venture Atlas
    url: https://rare-disease-atlas.github.io
  license:
    name: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/

servers:
  - url: https://rare-disease-atlas.github.io
    description: Production static GitHub Pages distribution
  - url: https://api.rare-disease-atlas.workers.dev
    description: Cloudflare Edge Streamable HTTP MCP (`/mcp`), A2A peer endpoint (`/a2a`), and persona router

paths:
  /opportunities.json:
    get:
      operationId: searchFounderOpportunitiesCorpus
      summary: Fetch full v1.6.0 structured dataset of founder opportunities, Paired Myelofibrosis Flagship case studies, comparative cohorts, grants, and ethical validation communities.
      description: >
        Returns the complete JSON atlas powering `rare-disease-atlas.github.io` and `orphan-disease-opportunity-mcp`
        (backing `search_founder_opportunities`, `get_disease_case_study`, `list_non_dilutive_grants`,
        `get_validation_communities`, and `get_90_day_validation_plan`; legacy aliases `match_founder_opportunities`,
        `find_non_dilutive_grants`, `generate_90_day_validation_plan`, and `analyze_any_orphan_indication` remain supported on `/mcp`).
      responses:
        "200":
          description: Full structured opportunity, biology, grant, and validation atlas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityAtlas"

  /llms.txt:
    get:
      operationId: getLlmsSiteMap
      summary: Retrieve concise LLM-optimized markdown index of rare-disease-atlas.github.io.
      description: Lightweight `llmstxt.org` compliant overview mapping founder tracks, Paired Myelofibrosis Flagships (`jak2-myelofibrosis` & `autoimmune-myelofibrosis`), v1.6.0 MCP tools, and structured resource links.
      responses:
        "200":
          description: Markdown executive summary for LLMs and RAG agents.
          content:
            text/plain:
              schema:
                type: string

  /llms-full.txt:
    get:
      operationId: getLlmsFullBriefing
      summary: Retrieve full single-file Markdown translational & venture briefing.
      description: Complete concatenated narrative briefing covering JAK2 V617F JH2 structural biology, Autoimmune Myelofibrosis (AIMF) marrow fibrosis reversal & iron overload, comparative cohorts, startup blueprints, and grants.
      responses:
        "200":
          description: Complete Markdown playbook.
          content:
            text/plain:
              schema:
                type: string

  /.well-known/mcp/server-card.json:
    get:
      operationId: getSep1649McpServerCard
      summary: Retrieve SEP-1649 Model Context Protocol (MCP) Server Card (v1.6.0) with streamable-http remote and 6 canonical read-verb tools.
      responses:
        "200":
          description: SEP-1649 MCP Server Card JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpDiscoveryManifest"

  /.well-known/mcp.json:
    get:
      operationId: getMcpDiscoveryManifest
      summary: Discover Model Context Protocol (MCP) server package, v1.6.0 canonical read-verb tools, resources, and prompts for this domain.
      responses:
        "200":
          description: MCP server capability manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpDiscoveryManifest"

  /.well-known/agent.json:
    get:
      operationId: getA2aAgentCard
      summary: Retrieve Agent2Agent (A2A) v1.6.0 Peer Specialist Agent Card.
      responses:
        "200":
          description: A2A Agent Card JSON.
          content:
            application/json:
              schema:
                type: object

  /.well-known/x402.json:
    get:
      operationId: getX402Manifest
      summary: Retrieve x402 v1.0 Free-Public-Good Agent Pricing & Endpoint Manifest ($0 USD, paymentRequired false).
      responses:
        "200":
          description: x402 Free Public-Good JSON manifest.
          content:
            application/json:
              schema:
                type: object

  /api/stress-test:
    post:
      operationId: stressTestOrphanHypothesis
      summary: Stateless Hypothesis Red-Team API critiquing drug, diagnostic, or rare-disease venture hypotheses.
      description: >
        Evaluates a candidate biological, diagnostic, or commercial rare-disease hypothesis against JH2 vs JH1
        allosteric selectivity traps, AIMF vs Triple-Negative PMF misdiagnosis discordance, Phase 3 clinical trial
        endpoint casualties (TRANSFORM-1, IMpactMF), MyelofibrosisBench-v1, and FY2026 FDA Orphan unit economics.
      servers:
        - url: https://api.rare-disease-atlas.workers.dev
          description: Cloudflare Edge Stateless Red-Team Worker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hypothesis
              additionalProperties: true
              properties:
                hypothesis:
                  type: string
                  description: Drug target, molecular binder/PROTAC, diagnostic classifier, or venture thesis to red-team.
                disease_id:
                  type: string
                  default: jak2-myelofibrosis
                target:
                  type: string
                modality:
                  type: string
                background:
                  type: string
      responses:
        "200":
          description: Structured biological, clinical-endpoint, and unit-economics stress-test critique.
          content:
            application/json:
              schema:
                type: object

  /api/gene:
    get:
      operationId: queryMyelofibrosisGeneSignatures
      summary: Query single-cell and stromal gene expression signatures across Clonal JAK2+ PMF and Reversible AIMF.
      description: >
        Zero-auth micro-API querying `myelofibrosis_gene_signatures` (GSE144568, GSE122198, GSE156644, GSE226340,
        and AIMF vs PMF stromal/iron axes) by gene symbol, disease cohort, marrow compartment, or free-text query.
      servers:
        - url: https://api.rare-disease-atlas.workers.dev
          description: Cloudflare Edge Molecular Micro-API Worker
      parameters:
        - name: symbol
          in: query
          required: false
          description: HGNC gene symbol filter (e.g., JAK2, HAMP, SLC40A1, S100A8, GLI1, TGFB1, G6B).
          schema:
            type: string
        - name: cohort
          in: query
          required: false
          description: Disease or cohort filter (e.g., jak2-myelofibrosis, autoimmune-myelofibrosis, pmf, aimf).
          schema:
            type: string
        - name: compartment
          in: query
          required: false
          description: Bone marrow cellular compartment filter (e.g., CD34+ HSPC, megakaryocyte, stroma, macrophage).
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Free-text keyword search across pathways, accessions, and biological notes.
          schema:
            type: string
      responses:
        "200":
          description: Matching gene signature records with primary GEO/PMID citations.
          content:
            application/json:
              schema:
                type: object

  /api/pocket:
    get:
      operationId: queryJak2StructuralPockets
      summary: Query JAK2 V617F JH2 vs wild-type JH2/JH1 and comparative orphan structural pockets.
      description: >
        Zero-auth micro-API querying `jak2_structural_pockets` (PDB 4FVR, 4FVQ, 6E2Q, 8BAK, 8EX2 vs WT 4FVP, 3KRR,
        and comparative UBA1 6DC6 / KIT D816V 4U0I / PAPD5 7BG9) by PDB ID, domain, target, or free-text query.
      servers:
        - url: https://api.rare-disease-atlas.workers.dev
          description: Cloudflare Edge Molecular Micro-API Worker
      parameters:
        - name: pdb
          in: query
          required: false
          description: RCSB PDB identifier filter (e.g., 4FVR, 4FVP, 6E2Q, 8BAK, 3KRR).
          schema:
            type: string
        - name: domain
          in: query
          required: false
          description: Protein domain filter (e.g., JH2, JH1, pseudokinase, kinase).
          schema:
            type: string
        - name: target
          in: query
          required: false
          description: Molecular target filter (e.g., JAK2 V617F, JAK2 WT, CALR, KIT D816V, UBA1).
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Free-text keyword search across residues, exit vectors, and selectivity notes.
          schema:
            type: string
      responses:
        "200":
          description: Matching structural pocket records with selectivity residues and PDB references.
          content:
            application/json:
              schema:
                type: object

  /api/compare:
    get:
      operationId: compareOrphanDiseaseCohorts
      summary: Side-by-side biological, clinical-trial, iron-axis, and venture comparison of two orphan cohorts.
      description: >
        Zero-auth micro-API comparing any two curated Atlas cohorts side-by-side. Defaults to the Paired Myelofibrosis
        Flagships: Clonal JAK2 V617F+ Primary Myelofibrosis (`jak2-myelofibrosis`) vs Reversible Autoimmune
        Myelofibrosis (`autoimmune-myelofibrosis`).
      servers:
        - url: https://api.rare-disease-atlas.workers.dev
          description: Cloudflare Edge Comparison Micro-API Worker
      parameters:
        - name: a
          in: query
          required: false
          description: First disease_id to compare.
          schema:
            type: string
            default: jak2-myelofibrosis
        - name: b
          in: query
          required: false
          description: Second disease_id to compare.
          schema:
            type: string
            default: autoimmune-myelofibrosis
      responses:
        "200":
          description: Structured side-by-side translational, diagnostic, and venture comparison JSON.
          content:
            application/json:
              schema:
                type: object

  /api/grade-benchmark:
    get:
      operationId: getMyelofibrosisBenchQuestions
      summary: Fetch MyelofibrosisBench-v1.1 (50 test + 5 dev) ungraded question manifest & grading schema (zero auth, $0 USD).
      description: >
        Returns the ungraded MyelofibrosisBench-v1.1 question set (without answer keys), category metadata,
        and submission schema for zero-install evaluation via `POST /api/grade-benchmark` (companion to
        `huggingface.co/datasets/rare-disease-atlas/MyelofibrosisBench` and `github.com/rare-disease-atlas/myelofibrosis-bench`).
      servers:
        - url: https://api.rare-disease-atlas.workers.dev
          description: Cloudflare Edge Zero-Install Benchmark Grader
      parameters:
        - name: split
          in: query
          required: false
          description: Dataset split to retrieve (`test` for 50 scored items, `dev` for 5 calibration items, or `all`).
          schema:
            type: string
            enum:
              - test
              - dev
              - all
            default: test
      responses:
        "200":
          description: Ungraded MyelofibrosisBench-v1.1 items and submission instructions.
          content:
            application/json:
              schema:
                type: object
    post:
      operationId: gradeMyelofibrosisBenchPredictions
      summary: Deterministically grade MyelofibrosisBench-v1.1 predictions & optionally publish aggregate score to the live leaderboard.
      description: >
        Statelessly grades submitted 4-choice answers and mechanistic reasoning-keyword coverage against the
        MyelofibrosisBench-v1.1 ground truth (50 test + 5 dev items). When `submit_to_leaderboard: true`,
        publishes only aggregate accuracy, per-category counts, reasoning coverage, and `model_name` (zero PII, zero raw prompts).
      servers:
        - url: https://api.rare-disease-atlas.workers.dev
          description: Cloudflare Edge Zero-Install Benchmark Grader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - predictions
              additionalProperties: true
              properties:
                model_name:
                  type: string
                  description: Optional model or agent identifier for leaderboard attribution.
                split:
                  type: string
                  enum:
                    - test
                    - dev
                  default: test
                submit_to_leaderboard:
                  type: boolean
                  default: false
                  description: Opt-in flag to publish aggregate score to GET /api/leaderboard.json (zero PII).
                predictions:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - choice
                    properties:
                      id:
                        type: string
                        example: "mf-bench-001"
                      choice:
                        type: string
                        enum:
                          - A
                          - B
                          - C
                          - D
                      reasoning:
                        type: string
                        description: Optional mechanistic reasoning text evaluated for primary-cited keyword coverage.
      responses:
        "200":
          description: Deterministic accuracy, per-category breakdown, reasoning-keyword coverage, and leaderboard status.
          content:
            application/json:
              schema:
                type: object

  /api/leaderboard.json:
    get:
      operationId: getMyelofibrosisBenchLeaderboard
      summary: Retrieve live MyelofibrosisBench-v1.1 model & agent leaderboard standings (zero PII, CC-BY-4.0).
      description: >
        Returns aggregate accuracy, per-category breakdown, and reasoning-keyword coverage across reference baselines
        (Oracle Ground-Truth Ceiling 100.0%, Stratified Keyword Heuristic 50.0%, Random 4-Choice Baseline 25.0%) and
        opt-in anonymous agent submissions for MyelofibrosisBench-v1.1 (50 test + 5 dev items).
      servers:
        - url: https://api.rare-disease-atlas.workers.dev
          description: Cloudflare Edge Leaderboard API
      responses:
        "200":
          description: Live MyelofibrosisBench-v1.1 leaderboard JSON.
          content:
            application/json:
              schema:
                type: object

  /feeds/catalysts.json:
    get:
      operationId: getMyelofibrosisCatalystsJson
      summary: Retrieve structured JSON calendar of upcoming Myelofibrosis, AIMF, and comparative orphan clinical/regulatory catalysts.
      description: >
        Zero-auth JSON feed listing upcoming Phase 1–3 trial readouts, FDA regulatory/RDEA milestones, and major
        hematology congress (ASH, EHA, ASCO) catalyst windows with primary NCT identifiers.
      servers:
        - url: https://api.rare-disease-atlas.workers.dev
          description: Cloudflare Edge Catalyst Feed Worker
      responses:
        "200":
          description: Structured clinical and regulatory catalyst calendar JSON.
          content:
            application/json:
              schema:
                type: object

  /feeds/myelofibrosis-catalysts.ics:
    get:
      operationId: getMyelofibrosisCatalystsIcs
      summary: Subscribe to the iCalendar (.ics) feed of Myelofibrosis & orphan hematology clinical trial catalysts.
      description: >
        RFC 5545 iCalendar (`.ics`) feed subscribable in Google Calendar, Apple Calendar, Outlook, or autonomous
        research agent schedulers tracking NCT trial readouts and hematology congress milestones.
      servers:
        - url: https://api.rare-disease-atlas.workers.dev
          description: Cloudflare Edge Catalyst Calendar Worker
      responses:
        "200":
          description: RFC 5545 iCalendar (.ics) document.
          content:
            text/calendar:
              schema:
                type: string

  /feeds/bio-delta.json:
    get:
      operationId: getBioDeltaJsonWire
      summary: Retrieve daily Myelofibrosis & Orphan Bio-Delta intelligence wire (JSON Feed 1.1).
      responses:
        "200":
          description: Structured JSON Feed 1.1 of ClinicalTrials.gov, PubMed, NCBI GEO, and PDB deltas.
          content:
            application/json:
              schema:
                type: object

  /atom.xml:
    get:
      operationId: getBioDeltaAtomWire
      summary: Retrieve daily Myelofibrosis & Orphan Bio-Delta syndication wire (Atom 1.0 XML).
      responses:
        "200":
          description: Atom 1.0 XML feed.
          content:
            application/atom+xml:
              schema:
                type: string

  /open-problems.json:
    get:
      operationId: getOpenComputationalProblems
      summary: Retrieve structured open computational & translational grand challenges in Myelofibrosis and AIMF.
      responses:
        "200":
          description: JSON array/registry of open computational problems with datasets, evaluation metrics, and starter baselines.
          content:
            application/json:
              schema:
                type: object

  /benchmarks/myelofibrosis_bench.jsonl:
    get:
      operationId: getMyelofibrosisBenchV1
      summary: Download MyelofibrosisBench-v1.1 (50 test + 5 dev primary-cited translational & structural reasoning items in JSONL).
      responses:
        "200":
          description: Newline-delimited JSON (JSONL) benchmark items.
          content:
            application/jsonl:
              schema:
                type: string

  /CITATION.cff:
    get:
      operationId: getCitationCff
      summary: Retrieve CFF 1.2.0 academic citation metadata for the Rare Disease Venture Atlas & MyelofibrosisBench-v1.1.
      responses:
        "200":
          description: Citation File Format (CFF 1.2.0) YAML document.
          content:
            text/yaml:
              schema:
                type: string

components:
  schemas:
    OpportunityAtlas:
      type: object
      required:
        - schema_version
        - atlas_name
        - flagship_disease_id
        - opportunities
      properties:
        schema_version:
          type: string
          example: "1.6.0"
        atlas_name:
          type: string
          example: "Rare Disease Venture & Translational Opportunity Atlas"
        canonical_url:
          type: string
          format: uri
        license:
          type: string
          example: "CC-BY-4.0"
        flagship_disease_id:
          type: string
          example: "jak2-myelofibrosis"
        flagship_disease_ids:
          type: array
          items:
            type: string
        mcp_tools:
          type: array
          items:
            type: string
        opportunities:
          type: array
          items:
            $ref: "#/components/schemas/FounderOpportunity"
        case_studies:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DiseaseCaseStudy"
        non_dilutive_grants:
          type: array
          items:
            $ref: "#/components/schemas/GrantProgram"
        validation_communities:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ValidationCommunityGroup"

    FounderOpportunity:
      type: object
      required:
        - id
        - disease_id
        - title
        - backgrounds
        - capital_tier
        - wet_lab_required
        - problem_wedge
        - solution_blueprint
      properties:
        id:
          type: string
        disease_id:
          type: string
        title:
          type: string
        backgrounds:
          type: array
          items:
            type: string
            enum:
              - computational-ai-bio
              - public-health
              - venture-novel-financing
        capital_tier:
          type: string
          enum:
            - bootstrapped-grant
            - seed
            - series-a-platform
        capital_range_usd:
          type: string
        wet_lab_required:
          type: boolean
        problem_wedge:
          type: string
        solution_blueprint:
          type: string
        unit_economics:
          type: object
          additionalProperties:
            type: string
        regulatory_pathway:
          type: string
        first_90_days_milestones:
          type: array
          items:
            type: string
        open_datasets:
          type: array
          items:
            type: string

    DiseaseCaseStudy:
      type: object
      properties:
        disease_id:
          type: string
        name:
          type: string
        identifiers:
          type: object
        epidemiology:
          type: object
        biological_tractability:
          type: object
        standard_of_care_failure_modes:
          type: object
        regulatory_and_commercial_incentives:
          type: object
        open_datasets_and_tools:
          type: array
          items:
            type: object

    GrantProgram:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        track:
          type: string
          enum:
            - sbir-sttr
            - foundation
            - venture-philanthropy
            - regulatory-orphan
            - federal-translational
        typical_award_usd:
          type: string
        equity_dilution:
          type: string
        focus_areas:
          type: string
        url:
          type: string
          format: uri

    ValidationCommunityGroup:
      type: object
      properties:
        disease_id:
          type: string
        institutional_and_patient_communities:
          type: array
          items:
            type: object
        ethical_discovery_guidelines:
          type: array
          items:
            type: string

    McpDiscoveryManifest:
      type: object
      properties:
        mcpVersion:
          type: string
        name:
          type: string
        title:
          type: string
        version:
          type: string
        description:
          type: string
        homepage:
          type: string
          format: uri
        remotes:
          type: array
          items:
            type: object
        authentication:
          type: object
        capabilities:
          type: object
        tools:
          type: array
          items: {}
        resources:
          type: array
          items: {}
        prompts:
          type: array
          items: {}
