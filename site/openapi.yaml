openapi: 3.1.0
info:
  title: Orphan Disease Venture & Translational Opportunity API
  version: 1.6.0
  summary: Zero-auth static JSON, SEP-1649 MCP Server Card, A2A Agent Card, and Edge endpoints for AI agents, Custom GPT Actions, and OpenAPI tool callers.
  description: >
    Machine-readable startup blueprints, biological tractability, FDA Orphan Drug Act unit economics,
    non-dilutive SBIR/venture-philanthropy grants, 90-day validation roadmaps, and ethical clinical validation pathways.
    Anchored on Paired Myelofibrosis Flagships—Clonal JAK2 V617F+ Primary Myelofibrosis (`jak2-myelofibrosis`)
    and Reversible JAK2-Negative Autoimmune Myelofibrosis + Iron/Hepcidin Overload (`autoimmune-myelofibrosis`)—plus
    4 comparative hematology/immunology cohorts and live 7,000-orphan-disease MCP diligence (`https://api.rare-disease-atlas.workers.dev/mcp`,
    canonical v1.6.0 read-verb tools: `search_founder_opportunities`, `get_disease_case_study`, `list_non_dilutive_grants`,
    `get_validation_communities`, `get_90_day_validation_plan`, `search_any_orphan_indication`).
  contact:
    name: Rare Disease Venture Atlas
    url: https://rare-disease-atlas.github.io
  license:
    name: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/

servers:
  - url: https://rare-disease-atlas.github.io
    description: Production static GitHub Pages distribution
  - url: https://api.rare-disease-atlas.workers.dev
    description: Cloudflare Edge Streamable HTTP MCP (`/mcp`), A2A peer endpoint (`/a2a`), and persona router

paths:
  /opportunities.json:
    get:
      operationId: searchFounderOpportunitiesCorpus
      summary: Fetch full v1.6.0 structured dataset of founder opportunities, Paired Myelofibrosis Flagship case studies, comparative cohorts, grants, and ethical validation communities.
      description: >
        Returns the complete JSON atlas powering `rare-disease-atlas.github.io` and `orphan-disease-opportunity-mcp`
        (backing `search_founder_opportunities`, `get_disease_case_study`, `list_non_dilutive_grants`,
        `get_validation_communities`, and `get_90_day_validation_plan`; legacy aliases `match_founder_opportunities`,
        `find_non_dilutive_grants`, `generate_90_day_validation_plan`, and `analyze_any_orphan_indication` remain supported on `/mcp`).
      responses:
        "200":
          description: Full structured opportunity, biology, grant, and validation atlas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityAtlas"

  /llms.txt:
    get:
      operationId: getLlmsSiteMap
      summary: Retrieve concise LLM-optimized markdown index of rare-disease-atlas.github.io.
      description: Lightweight `llmstxt.org` compliant overview mapping founder tracks, Paired Myelofibrosis Flagships (`jak2-myelofibrosis` & `autoimmune-myelofibrosis`), v1.6.0 MCP tools, and structured resource links.
      responses:
        "200":
          description: Markdown executive summary for LLMs and RAG agents.
          content:
            text/plain:
              schema:
                type: string

  /llms-full.txt:
    get:
      operationId: getLlmsFullBriefing
      summary: Retrieve full single-file Markdown translational & venture briefing.
      description: Complete concatenated narrative briefing covering JAK2 V617F JH2 structural biology, Autoimmune Myelofibrosis (AIMF) marrow fibrosis reversal & iron overload, comparative cohorts, startup blueprints, and grants.
      responses:
        "200":
          description: Complete Markdown playbook.
          content:
            text/plain:
              schema:
                type: string

  /.well-known/mcp/server-card.json:
    get:
      operationId: getSep1649McpServerCard
      summary: Retrieve SEP-1649 Model Context Protocol (MCP) Server Card (v1.6.0) with streamable-http remote and 6 canonical read-verb tools.
      responses:
        "200":
          description: SEP-1649 MCP Server Card JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpDiscoveryManifest"

  /.well-known/mcp.json:
    get:
      operationId: getMcpDiscoveryManifest
      summary: Discover Model Context Protocol (MCP) server package, v1.6.0 canonical read-verb tools, resources, and prompts for this domain.
      responses:
        "200":
          description: MCP server capability manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpDiscoveryManifest"

  /.well-known/agent.json:
    get:
      operationId: getA2aAgentCard
      summary: Retrieve Agent2Agent (A2A) v1.6.0 Peer Specialist Agent Card.
      responses:
        "200":
          description: A2A Agent Card JSON.
          content:
            application/json:
              schema:
                type: object

components:
  schemas:
    OpportunityAtlas:
      type: object
      required:
        - schema_version
        - atlas_name
        - flagship_disease_id
        - opportunities
      properties:
        schema_version:
          type: string
          example: "1.6.0"
        atlas_name:
          type: string
          example: "Rare Disease Venture & Translational Opportunity Atlas"
        canonical_url:
          type: string
          format: uri
        license:
          type: string
          example: "CC-BY-4.0"
        flagship_disease_id:
          type: string
          example: "jak2-myelofibrosis"
        flagship_disease_ids:
          type: array
          items:
            type: string
        mcp_tools:
          type: array
          items:
            type: string
        opportunities:
          type: array
          items:
            $ref: "#/components/schemas/FounderOpportunity"
        case_studies:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DiseaseCaseStudy"
        non_dilutive_grants:
          type: array
          items:
            $ref: "#/components/schemas/GrantProgram"
        validation_communities:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ValidationCommunityGroup"

    FounderOpportunity:
      type: object
      required:
        - id
        - disease_id
        - title
        - backgrounds
        - capital_tier
        - wet_lab_required
        - problem_wedge
        - solution_blueprint
      properties:
        id:
          type: string
        disease_id:
          type: string
        title:
          type: string
        backgrounds:
          type: array
          items:
            type: string
            enum:
              - computational-ai-bio
              - public-health
              - venture-novel-financing
        capital_tier:
          type: string
          enum:
            - bootstrapped-grant
            - seed
            - series-a-platform
        capital_range_usd:
          type: string
        wet_lab_required:
          type: boolean
        problem_wedge:
          type: string
        solution_blueprint:
          type: string
        unit_economics:
          type: object
          additionalProperties:
            type: string
        regulatory_pathway:
          type: string
        first_90_days_milestones:
          type: array
          items:
            type: string
        open_datasets:
          type: array
          items:
            type: string

    DiseaseCaseStudy:
      type: object
      properties:
        disease_id:
          type: string
        name:
          type: string
        identifiers:
          type: object
        epidemiology:
          type: object
        biological_tractability:
          type: object
        standard_of_care_failure_modes:
          type: object
        regulatory_and_commercial_incentives:
          type: object
        open_datasets_and_tools:
          type: array
          items:
            type: object

    GrantProgram:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        track:
          type: string
          enum:
            - sbir-sttr
            - foundation
            - venture-philanthropy
            - regulatory-orphan
            - federal-translational
        typical_award_usd:
          type: string
        equity_dilution:
          type: string
        focus_areas:
          type: string
        url:
          type: string
          format: uri

    ValidationCommunityGroup:
      type: object
      properties:
        disease_id:
          type: string
        institutional_and_patient_communities:
          type: array
          items:
            type: object
        ethical_discovery_guidelines:
          type: array
          items:
            type: string

    McpDiscoveryManifest:
      type: object
      properties:
        mcpVersion:
          type: string
        name:
          type: string
        title:
          type: string
        version:
          type: string
        description:
          type: string
        homepage:
          type: string
          format: uri
        remotes:
          type: array
          items:
            type: object
        authentication:
          type: object
        capabilities:
          type: object
        tools:
          type: array
          items: {}
        resources:
          type: array
          items: {}
        prompts:
          type: array
          items: {}
